<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Timezones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .welcome-message {
            background: rgba(0, 255, 136, 0.2);
            border-left: 4px solid #00ff88;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
            font-size: 0.95em;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .clock-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .drag-handle {
            cursor: grab;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .timezone-name {
            font-size: 1.3em;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }

        .digital-clock {
            font-size: 2.5em;
            color: #00ff88;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        .date-display {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }

        .timezone-offset {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .add-timezone-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .add-timezone-section h2 {
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 5px;
            font-size: 1em;
        }

        select option, input::placeholder {
            color: #666;
        }

        select {
            cursor: pointer;
        }

        .status-message {
            text-align: center;
            color: #ffff00;
            font-size: 0.95em;
            margin-top: 10px;
            min-height: 20px;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .format-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .format-toggle label {
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .format-toggle label:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .format-toggle input[type="radio"] {
            cursor: pointer;
            width: auto;
        }

        .search-input {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 5px;
            font-size: 1em;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .max-clocks-warning {
            background: rgba(255, 200, 0, 0.2);
            border-left: 4px solid #ffff00;
            padding: 10px;
            border-radius: 5px;
            color: #fff;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            transform: scale(1.2);
        }

        .theme-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        .theme-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-ocean { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .theme-sunset { background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%); }
        .theme-forest { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .digital-clock {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .input-group {
                flex-direction: column;
            }

            .format-toggle {
                flex-direction: column;
            }

            .format-toggle label {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Global Digital Clock</h1>
        
        <div class="welcome-message" id="welcomeMsg">
            👋 Welcome! You have <strong>6 default clocks</strong>. Add your timezone or customize as needed.
        </div>

        <div class="theme-selector">
            <button class="theme-btn theme-purple active" onclick="setTheme('purple')" title="Purple Theme"></button>
            <button class="theme-btn theme-ocean" onclick="setTheme('ocean')" title="Ocean Theme"></button>
            <button class="theme-btn theme-sunset" onclick="setTheme('sunset')" title="Sunset Theme"></button>
            <button class="theme-btn theme-forest" onclick="setTheme('forest')" title="Forest Theme"></button>
        </div>
        
        <div class="format-toggle">
            <label>
                <input type="radio" name="timeFormat" value="24" checked>
                24-Hour Format
            </label>
            <label>
                <input type="radio" name="timeFormat" value="12">
                12-Hour Format (AM/PM)
            </label>
        </div>

        <div class="clocks-grid" id="clocksContainer" style="touch-action: none;">
            <!-- Clocks will be dynamically inserted here -->
        </div>

        <div class="controls">
            <button onclick="resetClocks()">🔄 Reset to Default</button>
            <button onclick="clearAllClocks()">🗑️ Clear All</button>
            <button onclick="addLocalTimezone()">📍 Add My Timezone</button>
            <button onclick="sortClocks()">🔤 Sort A-Z</button>
        </div>

        <div class="add-timezone-section">
            <h2>Add Custom Timezone</h2>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search timezones...">
            <div class="input-group">
                <select id="timezoneSelect">
                    <option value="">Select a timezone...</option>
                </select>
                <input type="text" id="customLabel" placeholder="Custom label (optional)">
                <button onclick="addCustomTimezone()">➕ Add</button>
            </div>
            <div class="status-message" id="statusMessage"></div>
            <div id="maxClocksWarning"></div>
        </div>
    </div>

    <script>
        // List of major timezones
        const defaultTimezones = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
        ];

        const allTimezones = [
            'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
            'America/Anchorage', 'Pacific/Honolulu', 'America/Toronto', 'America/Mexico_City',
            'America/Sao_Paulo', 'America/Buenos_Aires',
            'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow',
            'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos',
            'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Singapore',
            'Asia/Hong_Kong', 'Asia/Shanghai', 'Asia/Tokyo', 'Asia/Seoul',
            'Australia/Sydney', 'Australia/Melbourne', 'Australia/Perth',
            'Pacific/Auckland', 'Pacific/Fiji'
        ];

        const MAX_CUSTOM_CLOCKS = 10;
        let customTimezones = [];
        let timeFormat = '24';
        let currentTheme = 'purple';
        let draggedElement = null;

        // Theme configurations
        const themes = {
            purple: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            ocean: 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
            sunset: 'linear-gradient(135deg, #ff6b6b 0%, #feca57 100%)',
            forest: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)'
        };

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            populateTimezoneSelect();
            loadCustomTimezones();
            updateAllClocks();
            setInterval(updateAllClocks, 1000);
            
            // Format toggle
            document.querySelectorAll('input[name="timeFormat"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    timeFormat = e.target.value;
                });
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const select = document.getElementById('timezoneSelect');
                
                Array.from(select.options).forEach(option => {
                    if (option.value === '') return;
                    option.style.display = option.value.toLowerCase().includes(searchTerm) ? '' : 'none';
                });
            });

            // Load theme from localStorage
            const savedTheme = localStorage.getItem('clockTheme') || 'purple';
            setTheme(savedTheme);
        });

        function setTheme(theme) {
            currentTheme = theme;
            document.body.style.background = themes[theme];
            localStorage.setItem('clockTheme', theme);
            
            // Update active button
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            allTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz;
                select.appendChild(option);
            });
        }

        function updateAllClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            const allTZ = [...defaultTimezones, ...customTimezones];

            allTZ.forEach((item, index) => {
                const clockCard = createClockCard(item, index);
                container.appendChild(clockCard);
            });

            updateMaxClocksWarning();
        }

        function createClockCard(item, index) {
            const card = document.createElement('div');
            card.className = 'clock-card';
            card.id = `clock-${index}`;
            card.draggable = true;

            const now = new Date();
            const timeString = now.toLocaleString('en-US', {
                timeZone: item.tz,
                hour: timeFormat === '24' ? '2-digit' : '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: timeFormat === '12'
            });

            const dateString = now.toLocaleString('en-US', {
                timeZone: item.tz,
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: '2-digit'
            });

            const offset = getTimezoneOffset(item.tz);

            card.innerHTML = `
                <div class="drag-handle">⋮⋮ Drag to reorder</div>
                <div class="timezone-name">${item.name}</div>
                <div class="digital-clock" id="time-${index}">${timeString}</div>
                <div class="date-display">${dateString}</div>
                <div class="timezone-offset">UTC ${offset}</div>
                ${index >= defaultTimezones.length ? `<button onclick="removeTimezone(${index})" style="width: 100%; margin-top: 10px; background: rgba(255, 100, 100, 0.2); border-color: rgba(255, 100, 100, 0.5);">✕ Remove</button>` : ''}
            `;

            // Drag events
            card.addEventListener('dragstart', (e) => {
                draggedElement = card;
                card.style.opacity = '0.5';
            });

            card.addEventListener('dragend', () => {
                card.style.opacity = '1';
                draggedElement = null;
            });

            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (draggedElement && draggedElement !== card) {
                    card.parentNode.insertBefore(draggedElement, card);
                }
            });

            return card;
        }

        function getTimezoneOffset(tz) {
            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            
            const sign = offset >= 0 ? '+' : '';
            const hours = Math.floor(Math.abs(offset));
            const minutes = Math.round((Math.abs(offset) % 1) * 60);
            
            return `${sign}${hours}:${minutes.toString().padStart(2, '0')}`;
        }

        function addCustomTimezone() {
            const select = document.getElementById('timezoneSelect');
            const label = document.getElementById('customLabel');
            const tz = select.value;
            const customLabel = label.value;

            if (!tz) {
                showStatus('❌ Please select a timezone', 'red');
                return;
            }

            if (customTimezones.length >= MAX_CUSTOM_CLOCKS) {
                showStatus(`❌ Maximum ${MAX_CUSTOM_CLOCKS} custom timezones allowed`, 'red');
                return;
            }

            if (customTimezones.some(item => item.tz === tz)) {
                showStatus('⚠️ This timezone is already added', 'orange');
                return;
            }

            const name = customLabel || tz.split('/')[1];
            customTimezones.push({ name, tz });
            
            saveCustomTimezones();
            updateAllClocks();
            select.value = '';
            label.value = '';
            showStatus('✅ Timezone added successfully', 'green');
        }

        function removeTimezone(index) {
            customTimezones.splice(index - defaultTimezones.length, 1);
            saveCustomTimezones();
            updateAllClocks();
            showStatus('✅ Timezone removed', 'green');
        }

        function addLocalTimezone() {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            if (customTimezones.length >= MAX_CUSTOM_CLOCKS) {
                showStatus(`❌ Maximum ${MAX_CUSTOM_CLOCKS} custom timezones allowed`, 'red');
                return;
            }
            
            if (customTimezones.some(item => item.tz === tz) || 
                defaultTimezones.some(item => item.tz === tz)) {
                showStatus('⚠️ Your timezone is already added', 'orange');
                return;
            }

            const name = tz.split('/')[1] || 'Local';
            customTimezones.push({ name, tz });
            
            saveCustomTimezones();
            updateAllClocks();
            showStatus('✅ Your timezone added', 'green');
        }

        function sortClocks() {
            const container = document.getElementById('clocksContainer');
            const cards = Array.from(container.children);
            
            cards.sort((a, b) => {
                const nameA = a.querySelector('.timezone-name').textContent;
                const nameB = b.querySelector('.timezone-name').textContent;
                return nameA.localeCompare(nameB);
            });

            cards.forEach(card => container.appendChild(card));
            showStatus('✅ Clocks sorted A-Z', 'green');
        }

        function resetClocks() {
            customTimezones = [];
            localStorage.removeItem('customTimezones');
            updateAllClocks();
            showStatus('✅ Reset to default timezones', 'green');
        }

        function clearAllClocks() {
            customTimezones = [];
            localStorage.removeItem('customTimezones');
            document.getElementById('clocksContainer').innerHTML = '';
            showStatus('✅ All clocks cleared', 'green');
        }

        function updateMaxClocksWarning() {
            const warning = document.getElementById('maxClocksWarning');
            if (customTimezones.length >= MAX_CUSTOM_CLOCKS) {
                warning.innerHTML = `⚠️ You've reached the maximum of ${MAX_CUSTOM_CLOCKS} custom timezones. Remove one to add another.`;
                warning.className = 'max-clocks-warning';
            } else {
                warning.innerHTML = '';
            }
        }

        function saveCustomTimezones() {
            localStorage.setItem('customTimezones', JSON.stringify(customTimezones));
        }

        function loadCustomTimezones() {
            const saved = localStorage.getItem('customTimezones');
            if (saved) {
                customTimezones = JSON.parse(saved);
            }
        }

        function showStatus(message, color = 'yellow') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.style.color = color;
            setTimeout(() => {
                statusEl.textContent = '';
            }, 3000);
        }
    </script>
</body>
</html>
